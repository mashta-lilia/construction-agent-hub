[project]
name = "reconstruction-hub-backend"
version = "0.1.0"
description = "Reconstruction Hub API and background workers"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "tortoise-orm==1.1.7",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.6",
    "arq>=0.26",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
