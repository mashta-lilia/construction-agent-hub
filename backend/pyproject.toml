[project]
name = "reconstruction-hub-backend"
version = "0.1.0"
description = "Reconstruction Hub API and background workers"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "uvloop>=0.22.1",
    "tortoise-orm[asyncpg]==1.1.7",
    "asyncpg>=0.31.0",
    "arq>=0.26",
    "redis>=5.2,<6",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.tortoise]
tortoise_orm = "app.database.TORTOISE_ORM"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
